set_pin:
  name: Définir le PIN d'un badge
  description: >-
    Attribue/change le PIN (4 chiffres) d'un badge existant dans le roster HA, puis
    régénère /config/www/ICCardDB0.ext. À APPLIQUER ensuite sur la doorbell (pont UART).
  fields:
    uid:
      name: UID du badge
      description: UID hexadécimal (ex. 940cbbe1), tel qu'affiché par le capteur cartes.
      required: true
      example: "940cbbe1"
      selector: { text: }
    pin:
      name: PIN
      description: 4 chiffres. Jamais journalisé.
      required: true
      example: "1234"
      selector: { text: }
    email:
      name: Email (optionnel)
      description: Email du porteur, mémorisé dans le roster (pour notification/traçabilité).
      required: false
      selector: { text: { type: email } }
    phone:
      name: Téléphone (optionnel)
      description: Numéro du porteur (format international, ex. +33612345678), pour l'envoi WhatsApp.
      required: false
      selector: { text: { type: tel } }
    entry_id:
      name: Doorbell
      description: >-
        Laquelle. Facultatif tant qu'il n'y en a qu'une ; OBLIGATOIRE des qu'il
        y en a deux — l'integration refuse de deviner plutot que d'ouvrir la
        mauvaise porte.
      required: false
      selector:
        config_entry:
          integration: doorbell_local

add_code:
  name: Ajouter un code PIN indépendant
  description: >-
    Crée un PIN autonome (carte virtuelle, sans badge physique) : le clavier l'accepte.
    Régénère le fichier. À APPLIQUER ensuite (pont UART).
  fields:
    pin:
      name: PIN
      description: 4 chiffres. Jamais journalisé.
      required: true
      example: "4826"
      selector: { text: }
    label:
      name: Libellé
      description: Nom du code (ex. « Femme de ménage », « Locataire »).
      required: false
      example: "Locataire"
      selector: { text: }
    email:
      name: Email (optionnel)
      description: Email à qui envoyer le code (l'envoi se fait par ton automatisation notify).
      required: false
      selector: { text: { type: email } }
    phone:
      name: Téléphone (optionnel)
      description: Numéro du porteur (format international, ex. +33612345678), pour l'envoi WhatsApp.
      required: false
      selector: { text: { type: tel } }
    entry_id:
      name: Doorbell
      description: >-
        Laquelle. Facultatif tant qu'il n'y en a qu'une ; OBLIGATOIRE des qu'il
        y en a deux — l'integration refuse de deviner plutot que d'ouvrir la
        mauvaise porte.
      required: false
      selector:
        config_entry:
          integration: doorbell_local

add_card:
  name: Inscrire un badge physique
  description: >-
    Ajoute une carte RFID au roster par son UID, sans passer par le menu
    d'administration de la doorbell. Le fichier ICCardDB fait autorite : la
    doorbell accepte la carte qu'il decrit, meme si elle ne l'a jamais enrolee.
    C'est ainsi qu'UN MEME BADGE OUVRE PLUSIEURS PORTES — inscrire le meme UID
    sur chacune. A APPLIQUER ensuite (pont UART).
  fields:
    uid:
      name: UID du badge
      description: >-
        UID hexadecimal. Il s'affiche dans le capteur « Staged PIN codes » sous
        `last_card` des qu'on presente la carte sur le lecteur.
      required: true
      example: "b4329fdd"
      selector: { text: }
    label:
      name: Libelle
      description: Nom du porteur. Vivement conseille — c'est lui qui identifie l'entree a l'ecran.
      required: false
      example: "Femme de menage"
      selector: { text: }
    pin:
      name: PIN (optionnel)
      description: >-
        4 chiffres, FACULTATIF : un badge ouvre sans code. Ne le remplir que
        pour exiger un second facteur. Jamais journalise.
      required: false
      selector: { text: }
    email:
      name: Email (optionnel)
      required: false
      selector: { text: { type: email } }
    phone:
      name: Telephone (optionnel)
      required: false
      selector: { text: { type: tel } }
    entry_id:
      name: Doorbell
      description: >-
        Laquelle. Facultatif tant qu'il n'y en a qu'une ; OBLIGATOIRE des qu'il
        y en a deux — l'integration refuse de deviner plutot que d'ouvrir la
        mauvaise porte.
      required: false
      selector:
        config_entry:
          integration: doorbell_local

