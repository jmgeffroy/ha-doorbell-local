set_pin:
  name: Définir le PIN d'un badge
  description: >-
    Attribue/change le PIN (4 chiffres) d'un badge existant dans le roster HA, puis
    régénère /config/www/ICCardDB0.ext. À APPLIQUER ensuite sur la doorbell (pont UART).
  fields:
    uid:
      name: UID du badge
      description: UID hexadécimal (ex. 940cbbe1), tel qu'affiché par le capteur cartes.
      required: true
      example: "940cbbe1"
      selector: { text: }
    pin:
      name: PIN
      description: 4 chiffres. Jamais journalisé.
      required: true
      example: "1234"
      selector: { text: }
    email:
      name: Email (optionnel)
      description: Email du porteur, mémorisé dans le roster (pour notification/traçabilité).
      required: false
      selector: { text: { type: email } }
    phone:
      name: Téléphone (optionnel)
      description: Numéro du porteur (format international, ex. +33612345678), pour l'envoi WhatsApp.
      required: false
      selector: { text: { type: tel } }
    entry_id:
      name: Doorbell
      required: false
      selector: { text: }

add_code:
  name: Ajouter un code PIN indépendant
  description: >-
    Crée un PIN autonome (carte virtuelle, sans badge physique) : le clavier l'accepte.
    Régénère le fichier. À APPLIQUER ensuite (pont UART).
  fields:
    pin:
      name: PIN
      description: 4 chiffres. Jamais journalisé.
      required: true
      example: "4826"
      selector: { text: }
    label:
      name: Libellé
      description: Nom du code (ex. « Femme de ménage », « Locataire »).
      required: false
      example: "Locataire"
      selector: { text: }
    email:
      name: Email (optionnel)
      description: Email à qui envoyer le code (l'envoi se fait par ton automatisation notify).
      required: false
      selector: { text: { type: email } }
    phone:
      name: Téléphone (optionnel)
      description: Numéro du porteur (format international, ex. +33612345678), pour l'envoi WhatsApp.
      required: false
      selector: { text: { type: tel } }
    entry_id:
      name: Doorbell
      required: false
      selector: { text: }

update_contact:
  name: Modifier le contact d'une entrée
  description: >-
    Change le libellé, l'email et/ou le téléphone d'une entrée du roster (sans toucher au PIN),
    puis régénère le fichier. Utilisé par les champs éditables du tableau.
  fields:
    uid:
      name: UID
      description: UID hexadécimal (badge ou carte virtuelle).
      required: true
      example: "f0000000"
      selector: { text: }
    label:
      name: Libellé
      required: false
      selector: { text: }
    email:
      name: Email
      required: false
      selector: { text: { type: email } }
    phone:
      name: Téléphone
      required: false
      selector: { text: { type: tel } }
    entry_id:
      name: Doorbell
      required: false
      selector: { text: }

remove_entry:
  name: Supprimer un badge/code du roster
  description: Retire l'entrée du roster HA et régénère le fichier.
  fields:
    uid:
      name: UID
      description: UID hexadécimal (badge ou carte virtuelle).
      required: true
      example: "f0000000"
      selector: { text: }
    entry_id:
      name: Doorbell
      required: false
      selector: { text: }

import_cards:
  name: Importer les cartes du device
  description: Ajoute au roster les cartes actuellement enrôlées sur la doorbell (UID+type), sans écraser les PIN déjà connus.
  fields:
    entry_id:
      name: Doorbell
      required: false
      selector: { text: }

stage:
  name: Régénérer le fichier
  description: Reconstruit /config/www/ICCardDB0.ext depuis le roster (sans autre changement).
  fields:
    entry_id:
      name: Doorbell
      required: false
      selector: { text: }

revoke_card:
  name: Révoquer une carte (réseau, instantané)
  description: Supprime une carte de la doorbell par son UID, via le MSG server. Immédiat, sans reboot.
  fields:
    uid:
      name: UID
      description: UID hexadécimal (ex. 940cbbe1).
      required: true
      example: "940cbbe1"
      selector: { text: }
    entry_id:
      name: Doorbell
      required: false
      selector: { text: }

refresh:
  name: Rafraîchir la liste des cartes
  description: Relit la base de cartes du device (réseau).
  fields:
    entry_id:
      name: Doorbell
      required: false
      selector: { text: }
