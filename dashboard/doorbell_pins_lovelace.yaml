# =============================================================================
# Vue Lovelace — Gestion des codes PIN de la doorbell (v2.1)
# À coller dans un tableau de bord (mode YAML) ou une nouvelle vue.
# Adapte les entity_id `sensor.doorbell_192_168_1_50_*` à ton IP réelle.
#
# La 2.1 crée, POUR CHAQUE code, des entités éditables (PIN / téléphone / email)
# + un bouton Supprimer. Deux façons de les afficher :
#   • Section « Modifier / Supprimer » ci-dessous = carte `auto-entities` (HACS,
#     https://github.com/thomasloven/lovelace-auto-entities) — se remplit toute
#     seule à chaque code créé.
#   • OU sans rien installer : Paramètres → Appareils → « Doorbell … » liste ces
#     entités et permet de les éditer/supprimer en ligne.
# =============================================================================
title: Accès
path: acces
icon: mdi:door
type: sections
sections:
  - type: grid
    cards:
      - type: heading
        heading: Créer un code PIN
        icon: mdi:key-plus
      - type: entities
        entities:
          # Commande AUSSI le bouton « Appliquer » plus bas : une porte choisie
          # ici est la porte visee partout sur cette vue.
          - entity: input_select.doorbell_target
          - entity: input_text.doorbell_new_pin
          - entity: input_text.doorbell_new_label
          - entity: input_text.doorbell_new_phone
          - entity: input_text.doorbell_new_email
      - type: button
        name: Créer le code
        icon: mdi:check
        tap_action:
          action: perform-action
          perform_action: script.doorbell_create_code
        show_state: false

  # --- Apprendre un badge ----------------------------------------------------
  # Presenter la carte sur le lecteur : la console de la doorbell annonce son
  # UID, connu ou non, et l'agent le publie dans le capteur de sante. Le bouton
  # l'inscrit au roster avec le libelle saisi plus haut.
  # Demande le package `doorbell_watchdog.yaml` (c'est lui qui porte le capteur).
  #
  # UNE SEULE carte, pas quatre : la mise en page en sections range les cartes
  # cote a cote, et quatre cartes separees s'eparpillent. Le bouton devient une
  # LIGNE de la carte `entities`, comme les « Appuyer » de Modifier / Supprimer.
  - type: grid
    cards:
      - type: heading
        heading: Inscrire un badge
        icon: mdi:card-account-details-outline
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              {%- set agents = {'Sous-sol': 'sous-sol', 'RDC': 'rdc'} -%}
              {%- set a = agents.get(states('input_select.doorbell_target'), '') -%}
              {%- set d = (state_attr('sensor.doorbell_agent_silence', 'doorbells') or {}) -%}
              {%- set c = (d.get(a) or {}).get('last_card') -%}
              {%- if c -%}
              Badge **`{{ c.uid }}`** — {{ 'déjà connu' if c.known else 'inconnu ici' }}, vu il y a {{ c.age_s | round(0) }} s
              {%- else -%}
              Présente une carte sur le lecteur, puis attends une minute.
              {%- endif -%}
          - type: entities
            entities:
              - entity: input_boolean.doorbell_all_doors
                name: Toutes les portes
              - type: button
                name: Badge présenté
                action_name: Inscrire
                tap_action:
                  action: perform-action
                  perform_action: script.doorbell_learn_card

  - type: grid
    cards:
      - type: heading
        heading: Codes actifs
        icon: mdi:format-list-bulleted
      # NB : on émet de VRAIES lignes markdown (pas une grosse chaîne `ns.t`) —
      # sinon les lignes vides que Jinja accumule cassent le rendu (table en
      # texte brut). `content:` en `|` OU `>` marche alors indifféremment.
      - type: markdown
        content: |
          {#- La carte suit input_select.doorbell_target. Les cles doivent
              reprendre MOT POUR MOT les options du selecteur, et la valeur est
              l'identifiant du capteur de CETTE doorbell (Outils de
              developpement -> Etats, filtre `staged_pin_codes`). Renommer un
              appareil change cet identifiant : le relire ici ce jour-la. -#}
          {% set sensors = {
               'Sous-sol': 'sensor.doorbell_192_168_1_50_staged_pin_codes',
               'RDC': 'sensor.doorbell_rdc_staged_pin_codes',
             } -%}
          {% set src = sensors.get(states('input_select.doorbell_target'), '') -%}
          | Type | Libellé | PIN | Téléphone | Email | Envoyer | UID |
          |:---:|---|:---:|---|---|:---:|---|
          {% for e in state_attr(src,'entries') or [] -%}
          {% set digits = (e.phone or '') | regex_replace('[^0-9]','') -%}
          {% set msg = ('Votre code d\'accès à la porte : ' ~ (e.pin or '') ~ ' (tapez-le puis #)') | urlencode -%}
          {% set wa = ('[📲](https://wa.me/' ~ digits ~ '?text=' ~ msg ~ ')') if (digits and e.pin) else '—' -%}
          {#- `virtual` distingue un code cree de toutes pieces (carte virtuelle)
              d'un vrai badge lu par le lecteur RFID. Sans cette colonne il faut
              deviner a la tete de l'UID, ce qui ne marche pas : les deux se
              ressemblent. -#}
          {% set kind = 'code' if e.virtual else 'badge' -%}
          | {{ kind }} | {{ e.label or '—' }} | `{{ e.pin or '—' }}` | {{ e.phone or '—' }} | {{ e.email or '—' }} | {{ wa }} | `{{ e.uid }}` |
          {% endfor -%}
      - type: button
        name: Appliquer sur la porte
        icon: mdi:upload
        tap_action:
          action: perform-action
          perform_action: script.doorbell_apply

  # --- Modifier / Supprimer (entités par-code de la 2.1) ---------------------
  # Nécessite la carte `auto-entities` (HACS). Sinon, retire cette section et
  # édite les codes depuis Paramètres → Appareils → « Doorbell … ».
  # Chaque code expose PIN / Téléphone / Email éditables + un bouton Supprimer.
  # Le tri par nom regroupe les 4 contrôles d'un même code (libellés uniques
  # conseillés). L'édition régénère le fichier → cliquer « Appliquer » ensuite.
  - type: grid
    cards:
      - type: heading
        heading: Modifier / Supprimer
        icon: mdi:pencil
      # Un bloc titre par code, au lieu d'une liste plate de 4 lignes par code
      # ou plus rien ne se distingue. L'en-tete porte le TYPE (badge physique ou
      # code virtuel), le libelle et le PIN — c'est ce qu'on cherche en arrivant.
      #
      # Le filtre suit `input_select.doorbell_target`, comme le reste de la vue :
      # les deux tables ci-dessous sont a renseigner, l'une par le NOM DE
      # L'APPAREIL (elle suit donc les renommages), l'autre par l'IDENTIFIANT DU
      # CAPTEUR (qui, lui, ne les suit pas).
      #
      # PIEGE : le rattachement d'une entite a son code se fait par son LIBELLE,
      # cherche dans le nom affiche. Deux libelles dont l'un contient l'autre
      # ("JM" et "JMG") melangeraient leurs lignes. Des libelles distincts.
      #
      # Pas de `sort` : l'ordre vient du roster, et trier casserait les blocs.
      - type: custom:auto-entities
        card:
          type: entities
          title: Modifier / Supprimer
          state_color: true
        show_empty: false
        filter:
          template: >-
            {%- set devices = {'Sous-sol': 'Doorbell Sous-sol',
                               'RDC': 'Doorbell RDC'} -%}
            {%- set sensors = {'Sous-sol': 'sensor.doorbell_192_168_1_50_staged_pin_codes',
                               'RDC': 'sensor.doorbell_rdc_staged_pin_codes'} -%}
            {%- set sel = states('input_select.doorbell_target') -%}
            {%- set dev = devices.get(sel) -%}
            {%- set id = device_id(dev) if dev else none -%}
            {%- set ents = (device_entities(id) if id else [])
                           | select('match', '^(text|button)\.') | list -%}
            {%- set ns = namespace(rows=[]) -%}
            {%- for e in state_attr(sensors.get(sel, ''), 'entries') or [] -%}
              {%- set tag = e.label if e.label else e.uid -%}
              {%- set kind = 'badge' if not e.virtual else 'code' -%}
              {%- set head = kind ~ ' — ' ~ tag ~ (' — ' ~ e.pin if e.pin else '') -%}
              {%- set ns.rows = ns.rows + [{'type': 'section', 'label': head}] -%}
              {%- for ent in ents -%}
                {%- if tag in (state_attr(ent, 'friendly_name') or '') -%}
                  {%- set ns.rows = ns.rows + [ent] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {{ ns.rows }}

  - type: grid
    cards:
      - type: heading
        heading: Badges (device)
        icon: mdi:card-account-details
      - type: entity
        entity: sensor.doorbell_192_168_1_50_enrolled_cards
        name: Badges enrôlés
      - type: markdown
        content: >
          {% for c in state_attr('sensor.doorbell_192_168_1_50_enrolled_cards','cards') or [] %}
          - `{{ c.uid }}` — {{ c.type }}
          {% endfor %}
