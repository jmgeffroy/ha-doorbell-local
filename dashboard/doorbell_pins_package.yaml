# =============================================================================
# Package Home Assistant — gestion des PIN de la doorbell (helpers + scripts)
# À déposer dans /config/packages/doorbell_pins.yaml
# (active les packages : dans configuration.yaml -> homeassistant: packages: !include_dir_named packages)
#
# PRÉREQUIS pour l'envoi d'email : un service notify (SMTP) configuré.
#   Remplace `notify.doorbell_email` (ci-dessous) par TON service, ex. notify.smtp.
#   Doc SMTP : https://www.home-assistant.io/integrations/smtp/
#
# NB SÉCURITÉ : les traces de script HA peuvent contenir le PIN en clair (local,
# admin uniquement). Le composant, lui, ne journalise jamais les PIN.
# =============================================================================

# Quelle porte ? Ce selecteur commande TOUT : la creation d'un code comme
# l'« Appliquer ». Les options doivent reprendre MOT POUR MOT les cles de la
# table `targets` plus bas — c'est par ce nom qu'un bouton retrouve sa doorbell.
input_select:
  doorbell_target:
    name: Doorbell
    icon: mdi:door
    options:
      - Sous-sol
      - RDC

input_text:
  doorbell_new_pin:
    name: Nouveau PIN (4 chiffres)
    max: 4
    # PAS de `pattern: "[0-9]{4}"` ICI, c'est une bombe a retardement : le script
    # remet le champ a "" apres chaque creation, et au redemarrage suivant HA
    # confronte cet etat vide au motif, echoue, et REFUSE DE CREER L'ENTITE
    # (« provides state which does not match expected pattern »). Le champ
    # devient alors un fantome grise du registre, sans rien dans l'interface qui
    # dise pourquoi. Les quatre chiffres sont deja verifies par le script, juste
    # avant `add_code` — c'est la que la garde a sa place.
    icon: mdi:dialpad
  doorbell_new_label:
    name: Libellé
    icon: mdi:label
  doorbell_new_email:
    name: Email (optionnel)
    icon: mdi:email
  doorbell_new_phone:
    name: Téléphone (optionnel)
    icon: mdi:phone

script:
  # --- Créer un code PIN indépendant + email au porteur ----------------------
  doorbell_create_code:
    alias: "Doorbell — créer un code PIN"
    icon: mdi:key-plus
    mode: single
    sequence:
      - variables:
          # -----------------------------------------------------------------
          # LES DOORBELLS — le seul endroit a renseigner, les autres scripts
          # recopient cette table (ancre YAML `doorbell_targets`).
          #   cle   = ce qu'affiche input_select.doorbell_target, mot pour mot
          #   entry = l'entree d'integration visee (`entry_id` des services)
          #   agent = la cle du dict DOORBELLS de l'agent UART
          # Trouver un `entry` : Outils de developpement -> Actions ->
          # « Doorbell — Regenerer le fichier » -> choisir la doorbell dans la
          # liste -> basculer en YAML : l'identifiant y est ecrit.
          # -----------------------------------------------------------------
          targets: &doorbell_targets
            Sous-sol:
              entry: "A_RENSEIGNER_1"
              agent: "sous-sol"
            RDC:
              entry: "A_RENSEIGNER_2"
              agent: "rdc"
          target: "{{ targets.get(states('input_select.doorbell_target'), {}) }}"
          pin: "{{ states('input_text.doorbell_new_pin') }}"
          label: "{{ states('input_text.doorbell_new_label') }}"
          email: "{{ states('input_text.doorbell_new_email') }}"
          phone: "{{ states('input_text.doorbell_new_phone') }}"
      - condition: template
        value_template: "{{ pin | regex_match('^[0-9]{4}$') }}"
        alias: "PIN = 4 chiffres"
      # Sans `entry_id`, l'integration refuse de deviner des qu'il y a deux
      # doorbells — et le code partirait sur la mauvaise porte si elle devinait.
      - condition: template
        value_template: >-
          {{ not target.get('entry', 'A_RENSEIGNER').startswith('A_RENSEIGNER') }}
        alias: "Doorbell choisie et renseignee"
      - service: doorbell_local.add_code
        data:
          entry_id: "{{ target.entry }}"
          pin: "{{ pin }}"
          label: "{{ label }}"
          email: "{{ email }}"
          phone: "{{ phone }}"
      # Option email : décommente ce bloc SI tu as un service notify (SMTP)
      # configuré, et remplace notify.doorbell_email par le tien.
      # - if:
      #     - condition: template
      #       value_template: "{{ email | length > 3 }}"
      #   then:
      #     - service: notify.doorbell_email
      #       data:
      #         target: "{{ email }}"
      #         title: "Votre code d'accès"
      #         message: "Votre code d'accès à la porte est : {{ pin }} (tapez-le puis #)."
      # Nettoie le formulaire
      - service: input_text.set_value
        target: { entity_id: input_text.doorbell_new_pin }
        data: { value: "" }
      - service: input_text.set_value
        target: { entity_id: input_text.doorbell_new_label }
        data: { value: "" }
      - service: input_text.set_value
        target: { entity_id: input_text.doorbell_new_email }
        data: { value: "" }
      - service: input_text.set_value
        target: { entity_id: input_text.doorbell_new_phone }
        data: { value: "" }
      # NB : pas d'auto-apply — on crée N codes puis on clique « Appliquer » 1×.

  # --- Appliquer le fichier sur la doorbell ---------------------------------
  # Appelle l'agent UART (doorbell_uart_agent.py) qui tape la ligne wget+reboot
  # dans le shell root de la doorbell. Voir agent/doorbell_uart_agent.py.
  doorbell_apply:
    alias: "Doorbell — appliquer (staging -> device)"
    icon: mdi:upload
    # Le défaut d'un `fields:` ne vaut QUE pour l'interface : un bouton qui appelle
    # le script sans rien passer laisserait la variable indéfinie, et l'URL
    # finirait en `?id=`. D'où le `| default(...)`, qui garantit le repli.
    fields:
      doorbell_id:
        name: Doorbell
        description: "Identifiant dans l'agent UART (sous-sol, rdc...)"
        default: sous-sol
        selector:
          text:
    variables:
      targets: *doorbell_targets
      # Un appel explicite garde la main ; sinon on suit le selecteur.
      target_id: >-
        {{ doorbell_id | default(targets.get(states('input_select.doorbell_target'),
           {}).get('agent', 'sous-sol'), true) }}
    sequence:
      - service: rest_command.doorbell_apply_uart
        data:
          doorbell_id: "{{ target_id }}"
      - service: persistent_notification.create
        data:
          notification_id: doorbell_apply
          title: "Doorbell"
          message: >-
            Fichier envoyé à la doorbell {{ target_id }} (wget + reboot).
            Le device redémarre (~1 min), puis les codes sont actifs.

  # --- Nettoyer les codes de test (cartes virtuelles f0000000 -> f0000008) ---
  # Supprime d'un coup les 9 codes de test du roster (garde f0000009 si présent).
  # N'applique PAS tout seul : clique « Appliquer » ensuite pour pousser.
  doorbell_cleanup_test_codes:
    alias: "Doorbell — nettoyer les codes de test"
    icon: mdi:broom
    mode: single
    sequence:
      - repeat:
          for_each:
            - "f0000000"
            - "f0000001"
            - "f0000002"
            - "f0000003"
            - "f0000004"
            - "f0000005"
            - "f0000006"
            - "f0000007"
            - "f0000008"
          sequence:
            # continue_on_error : un UID déjà absent ne stoppe pas la boucle
            - service: doorbell_local.remove_entry
              continue_on_error: true
              data:
                uid: "{{ repeat.item }}"
      - service: persistent_notification.create
        data:
          notification_id: doorbell_cleanup
          title: "Doorbell"
          message: >-
            Codes de test retirés du roster. Clique « Appliquer sur la porte »
            pour pousser le fichier régénéré (wget + reboot).

# Appel HTTP vers l'agent UART sur l'hôte (adapte l'IP de l'hôte et le token).
# `doorbell_id` désigne l'entrée du dict DOORBELLS de l'agent : une seule commande
# suffit donc pour autant de doorbells que tu veux.
rest_command:
  doorbell_apply_uart:
    url: "http://WINDOWS_HOST_IP:8765/apply?id={{ doorbell_id }}"
    method: POST
    headers:
      X-Token: "change-me"
