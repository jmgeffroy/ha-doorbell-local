# =============================================================================
# Package Home Assistant — gestion des PIN de la doorbell (helpers + scripts)
# À déposer dans /config/packages/doorbell_pins.yaml
# (active les packages : dans configuration.yaml -> homeassistant: packages: !include_dir_named packages)
#
# PRÉREQUIS pour l'envoi d'email : un service notify (SMTP) configuré.
#   Remplace `notify.doorbell_email` (ci-dessous) par TON service, ex. notify.smtp.
#   Doc SMTP : https://www.home-assistant.io/integrations/smtp/
#
# NB SÉCURITÉ : les traces de script HA peuvent contenir le PIN en clair (local,
# admin uniquement). Le composant, lui, ne journalise jamais les PIN.
# =============================================================================

# Quelle porte ? Ce selecteur commande TOUT : la creation d'un code comme
# l'« Appliquer ». Les options doivent reprendre MOT POUR MOT les cles de la
# table `targets` plus bas — c'est par ce nom qu'un bouton retrouve sa doorbell.
input_select:
  doorbell_target:
    name: Doorbell
    icon: mdi:door
    options:
      - Sous-sol
      - RDC

# Coche pour qu'un badge appris soit inscrit sur TOUTES les portes de la table,
# et pas seulement sur celle du selecteur. C'est ce qui permet qu'une meme carte
# ouvre partout : le fichier ICCardDB fait autorite, il suffit donc d'y inscrire
# le meme UID de chaque cote — la doorbell n'a pas besoin de l'avoir enrolee.
input_boolean:
  doorbell_all_doors:
    name: Inscrire sur toutes les portes
    icon: mdi:door-open

input_text:
  doorbell_new_pin:
    name: Nouveau PIN (4 chiffres)
    max: 4
    # PAS de `pattern: "[0-9]{4}"` ICI, c'est une bombe a retardement : le script
    # remet le champ a "" apres chaque creation, et au redemarrage suivant HA
    # confronte cet etat vide au motif, echoue, et REFUSE DE CREER L'ENTITE
    # (« provides state which does not match expected pattern »). Le champ
    # devient alors un fantome grise du registre, sans rien dans l'interface qui
    # dise pourquoi. Les quatre chiffres sont deja verifies par le script, juste
    # avant `add_code` — c'est la que la garde a sa place.
    icon: mdi:dialpad
  doorbell_new_label:
    name: Libellé
    icon: mdi:label
  doorbell_new_email:
    name: Email (optionnel)
    icon: mdi:email
  doorbell_new_phone:
    name: Téléphone (optionnel)
    icon: mdi:phone

script:
  # --- Créer un code PIN indépendant + email au porteur ----------------------
  doorbell_create_code:
    alias: "Doorbell — créer un code PIN"
    icon: mdi:key-plus
    mode: single
    sequence:
      - variables:
          # -----------------------------------------------------------------
          # LES DOORBELLS — le seul endroit a renseigner, les autres scripts
          # recopient cette table (ancre YAML `doorbell_targets`).
          #   cle   = ce qu'affiche input_select.doorbell_target, mot pour mot
          #   entry = l'entree d'integration visee (`entry_id` des services)
          #   agent = la cle du dict DOORBELLS de l'agent UART
          #   sensor = son capteur `..._staged_pin_codes` (Outils de
          #            developpement -> Etats, filtre `staged_pin_codes`)
          # Trouver un `entry` : Outils de developpement -> Actions ->
          # « Doorbell — Regenerer le fichier » -> choisir la doorbell dans la
          # liste -> basculer en YAML : l'identifiant y est ecrit.
          # -----------------------------------------------------------------
          targets: &doorbell_targets
            Sous-sol:
              entry: "A_RENSEIGNER_1"
              agent: "sous-sol"
              sensor: "A_RENSEIGNER_3"
            RDC:
              entry: "A_RENSEIGNER_2"
              agent: "rdc"
              sensor: "A_RENSEIGNER_4"
          target: "{{ targets.get(states('input_select.doorbell_target'), {}) }}"
          pin: "{{ states('input_text.doorbell_new_pin') }}"
          label: "{{ states('input_text.doorbell_new_label') }}"
          email: "{{ states('input_text.doorbell_new_email') }}"
          phone: "{{ states('input_text.doorbell_new_phone') }}"
      - condition: template
        value_template: "{{ pin | regex_match('^[0-9]{4}$') }}"
        alias: "PIN = 4 chiffres"
      # Sans `entry_id`, l'integration refuse de deviner des qu'il y a deux
      # doorbells — et le code partirait sur la mauvaise porte si elle devinait.
      - condition: template
        value_template: >-
          {{ not target.get('entry', 'A_RENSEIGNER').startswith('A_RENSEIGNER') }}
        alias: "Doorbell choisie et renseignee"
      - service: doorbell_local.add_code
        data:
          entry_id: "{{ target.entry }}"
          pin: "{{ pin }}"
          label: "{{ label }}"
          email: "{{ email }}"
          phone: "{{ phone }}"
      # Option email : décommente ce bloc SI tu as un service notify (SMTP)
      # configuré, et remplace notify.doorbell_email par le tien.
      # - if:
      #     - condition: template
      #       value_template: "{{ email | length > 3 }}"
      #   then:
      #     - service: notify.doorbell_email
      #       data:
      #         target: "{{ email }}"
      #         title: "Votre code d'accès"
      #         message: "Votre code d'accès à la porte est : {{ pin }} (tapez-le puis #)."
      # Nettoie le formulaire
      - service: input_text.set_value
        target: { entity_id: input_text.doorbell_new_pin }
        data: { value: "" }
      - service: input_text.set_value
        target: { entity_id: input_text.doorbell_new_label }
        data: { value: "" }
      - service: input_text.set_value
        target: { entity_id: input_text.doorbell_new_email }
        data: { value: "" }
      - service: input_text.set_value
        target: { entity_id: input_text.doorbell_new_phone }
        data: { value: "" }
      # NB : pas d'auto-apply — on crée N codes puis on clique « Appliquer » 1×.

  # --- Apprendre un badge presente sur le lecteur ----------------------------
  # La console de la doorbell annonce l'UID de TOUTE carte presentee, connue ou
  # non (`idcard num 0 b4329fdd`). L'agent le retient, le point de sante le
  # publie, et ce script l'inscrit au roster. Plus besoin du menu
  # d'administration de la doorbell.
  #
  # POURQUOI PAS UN WEBHOOK : les automatisations d'ouverture ne regardent que
  # le nom de la doorbell. Un evenement « badge vu » sur ce canal OUVRIRAIT LA
  # PORTE a toute carte inconnue. L'UID transite donc par le capteur de sante,
  # que HA interroge deja, et rien d'autre ne change.
  doorbell_learn_card:
    alias: "Doorbell — inscrire le badge presente"
    icon: mdi:card-account-details-outline
    mode: single
    variables:
      targets: *doorbell_targets
      sel: "{{ states('input_select.doorbell_target') }}"
      agents: "{{ state_attr('sensor.doorbell_agent_silence', 'doorbells') or {} }}"
      agent_key: "{{ targets.get(sel, {}).get('agent', '') }}"
      card: "{{ agents.get(agent_key, {}).get('last_card') or {} }}"
      # Au-dela de deux minutes, on ne sait plus de quelle carte il s'agit :
      # inscrire un UID vieux d'une heure donnerait un acces a l'aveugle.
      fresh: "{{ card.get('age_s', 9999) | float(9999) < 120 }}"
      doors: >-
        {{ targets.values() | list if is_state('input_boolean.doorbell_all_doors', 'on')
           else [targets.get(sel, {})] }}
    sequence:
      - condition: template
        value_template: "{{ card.get('uid', '') | length > 0 and fresh }}"
        alias: "Un badge a ete presente il y a moins de 2 minutes"
      - repeat:
          for_each: "{{ doors }}"
          sequence:
            # continue_on_error : un UID deja present sur une porte ne doit pas
            # empecher de l'inscrire sur les autres.
            - service: doorbell_local.add_card
              continue_on_error: true
              data:
                entry_id: "{{ repeat.item.entry }}"
                uid: "{{ card.uid }}"
                # Le formulaire porte deja email et telephone : les ignorer
                # obligeait a les ressaisir entree par entree ensuite.
                label: "{{ states('input_text.doorbell_new_label') }}"
                email: "{{ states('input_text.doorbell_new_email') }}"
                phone: "{{ states('input_text.doorbell_new_phone') }}"
      - repeat:
          for_each:
            - input_text.doorbell_new_label
            - input_text.doorbell_new_email
            - input_text.doorbell_new_phone
          sequence:
            - service: input_text.set_value
              target: { entity_id: "{{ repeat.item }}" }
              data: { value: "" }
      - service: persistent_notification.create
        data:
          notification_id: doorbell_learn
          title: "Doorbell"
          message: >-
            Badge {{ card.uid }} inscrit sur {{ doors | count }} porte(s).
            Clique « Appliquer » sur CHACUNE pour que ce soit effectif.

  # --- Appliquer le fichier sur la doorbell ---------------------------------
  # Appelle l'agent UART (doorbell_uart_agent.py) qui tape la ligne wget+reboot
  # dans le shell root de la doorbell. Voir agent/doorbell_uart_agent.py.
  doorbell_apply:
    alias: "Doorbell — appliquer (staging -> device)"
    icon: mdi:upload
    # Le défaut d'un `fields:` ne vaut QUE pour l'interface : un bouton qui appelle
    # le script sans rien passer laisserait la variable indéfinie, et l'URL
    # finirait en `?id=`. D'où le `| default(...)`, qui garantit le repli.
    fields:
      doorbell_id:
        name: Doorbell
        description: "Identifiant dans l'agent UART (sous-sol, rdc...)"
        default: sous-sol
        selector:
          text:
    variables:
      targets: *doorbell_targets
      # Un appel explicite garde la main ; sinon on suit le selecteur.
      target_id: >-
        {{ doorbell_id | default(targets.get(states('input_select.doorbell_target'),
           {}).get('agent', 'sous-sol'), true) }}
    sequence:
      # `response_variable` : SANS LUI, CE SCRIPT MENT. Il affichait « Fichier
      # envoye » sans jamais regarder si l'agent avait repondu — un jeton qui
      # ne concorde plus, et l'ordre part dans le vide pendant que l'interface
      # affiche un succes. Arrive deux fois le 30/10 et le 01/11/2026, dont une
      # ou la panne a dure onze jours.
      - service: rest_command.doorbell_apply_uart
        data:
          doorbell_id: "{{ target_id }}"
        response_variable: reply
      - choose:
          - alias: "L'agent a accepte l'ordre"
            conditions:
              - condition: template
                value_template: "{{ reply.status | default(0) | int == 200 }}"
            sequence:
              - service: persistent_notification.create
                data:
                  notification_id: doorbell_apply
                  title: "Doorbell"
                  message: >-
                    Fichier envoyé à la doorbell {{ target_id }} (wget + reboot).
                    Le device redémarre (~1 min), puis les codes sont actifs.
        default:
          - service: persistent_notification.create
            data:
              notification_id: doorbell_apply
              title: "Doorbell : L'APPLIQUER A ÉCHOUÉ"
              message: >-
                L'agent n'a pas accepté l'ordre pour « {{ target_id }} » —
                code {{ reply.status | default('aucune réponse') }}.
                **Les codes n'ont PAS été mis à jour sur la porte.**
                Un 403 signifie que le jeton `X-Token` de ce paquet ne
                concorde plus avec celui de `doorbells.json` sur l'agent.

  # --- Nettoyer les codes de test (cartes virtuelles f0000000 -> f0000008) ---
  # Supprime d'un coup les 9 codes de test du roster (garde f0000009 si présent).
  # N'applique PAS tout seul : clique « Appliquer » ensuite pour pousser.
  doorbell_cleanup_test_codes:
    alias: "Doorbell — nettoyer les codes de test"
    icon: mdi:broom
    mode: single
    variables:
      targets: *doorbell_targets
      target: "{{ targets.get(states('input_select.doorbell_target'), {}) }}"
      test_uids:
        - "f0000000"
        - "f0000001"
        - "f0000002"
        - "f0000003"
        - "f0000004"
        - "f0000005"
        - "f0000006"
        - "f0000007"
        - "f0000008"
      # On ne supprime QUE ce qui est dans la plage ET SANS PIN.
      # La plage seule ne veut rien dire : elle vient de l'histoire du sous-sol,
      # ou ces UID etaient des cartes de mise au point. Sur une doorbell
      # installee plus tard, les MEMES numeros portent les vrais codes —
      # ils sont simplement les premiers libres. Mesure du 01/11/2026 : la
      # doorbell RDC avait 3541, 3542 et 3543 en f0000000..2. Le script
      # d'origine les aurait tous les trois effaces.
      doomed: >-
        {{ (state_attr(target.get('sensor', ''), 'entries') or [])
           | selectattr('uid', 'in', test_uids)
           | rejectattr('pin_set')
           | map(attribute='uid') | list }}
    sequence:
      - condition: template
        value_template: >-
          {{ not target.get('entry', 'A_RENSEIGNER').startswith('A_RENSEIGNER')
             and not target.get('sensor', 'A_RENSEIGNER').startswith('A_RENSEIGNER') }}
        alias: "Doorbell choisie, entree et capteur renseignes"
      - condition: template
        value_template: "{{ doomed | count > 0 }}"
        alias: "Il y a bien quelque chose a nettoyer"
      - repeat:
          for_each: "{{ doomed }}"
          sequence:
            # continue_on_error : un UID déjà absent ne stoppe pas la boucle
            - service: doorbell_local.remove_entry
              continue_on_error: true
              data:
                entry_id: "{{ target.entry }}"
                uid: "{{ repeat.item }}"
      - service: persistent_notification.create
        data:
          notification_id: doorbell_cleanup
          title: "Doorbell"
          message: >-
            Codes de test retirés du roster. Clique « Appliquer sur la porte »
            pour pousser le fichier régénéré (wget + reboot).

# Appel HTTP vers l'agent UART sur l'hôte (adapte l'IP de l'hôte et le token).
# `doorbell_id` désigne l'entrée du dict DOORBELLS de l'agent : une seule commande
# suffit donc pour autant de doorbells que tu veux.
rest_command:
  # Impulsion temporisee sur le relais Modbus qui commande une gache.
  # `door` reprend les memes identifiants que les doorbells (sous-sol, rdc) :
  # la correspondance porte -> voie du boitier vit dans doorbells.json, cote
  # agent, et nulle part ailleurs.
  #
  # LA DUREE EST TENUE PAR LE BOITIER, pas par Home Assistant. Si HA, le reseau
  # ou l'agent disparaissent pendant l'ouverture, la gache se relache quand
  # meme. Ne jamais remplacer cet appel par un `switch.turn_on` suivi d'un
  # `delay` : ce jour-la, une coupure laisserait la porte ouverte.
  doorbell_relay:
    url: "http://WINDOWS_HOST_IP:8765/relay?id={{ door }}"
    method: POST
    headers:
      X-Token: "change-me"

  doorbell_apply_uart:
    url: "http://WINDOWS_HOST_IP:8765/apply?id={{ doorbell_id }}"
    method: POST
    headers:
      X-Token: "change-me"
